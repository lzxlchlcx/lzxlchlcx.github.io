<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1000" viewBox="0 0 900 1000" role="img" aria-labelledby="title desc">
  <title id="title">向着未知 · 星光轨迹</title>
  <desc id="desc">由近及远的蓝色发光路径在星空中延伸，沿途散落光点。抽象表达持续学习与构建，不表示具体个人经历。</desc>
  <defs>
    <linearGradient id="bg" x2=".6" y2="1"><stop stop-color="#050d1a"/><stop offset=".5" stop-color="#0a1b2c"/><stop offset="1" stop-color="#020610"/></linearGradient>
    <radialGradient id="nebula"><stop stop-color="#39758a" stop-opacity=".5"/><stop offset=".44" stop-color="#21506c" stop-opacity=".22"/><stop offset="1" stop-color="#0b1930" stop-opacity="0"/></radialGradient>
    <radialGradient id="purple"><stop stop-color="#6a547c" stop-opacity=".25"/><stop offset="1" stop-color="#201531" stop-opacity="0"/></radialGradient>
    <linearGradient id="path" x1=".2" y1="1" x2=".65" y2="0"><stop stop-color="#295467"/><stop offset=".35" stop-color="#65c3cf"/><stop offset=".7" stop-color="#aad8df"/><stop offset="1" stop-color="#bfdfea"/></linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2=".2" y2="1"><stop stop-color="#244257"/><stop offset="1" stop-color="#030b16"/></linearGradient>
    <radialGradient id="node"><stop stop-color="#edffff"/><stop offset=".1" stop-color="#9dd9df"/><stop offset=".42" stop-color="#367a90"/><stop offset="1" stop-color="#0b2d44"/></radialGradient>
