    <pattern id="stars" width="290" height="247" patternUnits="userSpaceOnUse"><circle cx="18" cy="45" r="1" fill="#a2d9e3" opacity=".5"/><circle cx="132" cy="96" r="1.2" fill="#d2e6eb" opacity=".7"/><circle cx="224" cy="16" r=".6" fill="#ecf8ff"/><circle cx="265" cy="193" r="1.2" fill="#89bbd4" opacity=".4"/><circle cx="60" cy="208" r=".6" fill="#d5d5f8"/><circle cx="181" cy="226" r=".9" fill="#b1d8d6" opacity=".4"/><circle cx="91" cy="18" r=".8" fill="#fff" opacity=".3"/></pattern>
